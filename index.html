<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harmony — CRM для бухгалтера ФОП</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="matrix.css">
<link rel="stylesheet" href="client-card-ui.css">
<link rel="icon" href="data:,">
</head>
<body class="auth-locked">
  <a class="skip-link" href="#content">До основного вмісту</a>
  <div id="bootOverlay" class="boot-overlay" hidden>
    <div class="boot-spinner"></div>
    <p>Завантаження даних…</p>
  </div>

  <section id="authGate" class="auth-gate" aria-labelledby="authTitle">
    <form id="authForm" class="auth-panel">
      <div class="auth-brand" aria-hidden="true">H</div>
      <h1 id="authTitle">Вхід до Harmony</h1>
      <p>Авторизуйтеся, щоб отримати доступ до робочого простору.</p>
      <label>Логін<input id="authLogin" name="login" autocomplete="username" required autofocus></label>
      <label>Пароль<input id="authPassword" name="password" type="password" autocomplete="current-password" required></label>
      <p id="authError" class="auth-error" role="alert" hidden></p>
      <button id="authSubmit" type="submit" class="primary">Увійти</button>
    </form>
  </section>

  <div id="appShell" class="app-shell" hidden inert aria-hidden="true">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">H</div>
      <div class="brand-text">Harmony<small id="userIdentity">CRM для бухгалтера ФОП</small></div>
    </div>
    <nav id="nav" aria-label="Основна навігація">
      <button data-view="overview" class="active" aria-label="Огляд" title="Огляд"><span class="nav-icon" aria-hidden="true">📊</span><span class="nav-label">Огляд</span></button>
      <button data-view="dashboard" aria-label="Картки клієнтів" title="Картки клієнтів"><span class="nav-icon" aria-hidden="true">👥</span><span class="nav-label">Картки клієнтів</span></button>
      <button data-view="payments" aria-label="Оплати" title="Оплати"><span class="nav-icon" aria-hidden="true">💸</span><span class="nav-label">Оплати</span></button>
      <button data-view="taxes" aria-label="Податки" title="Податки"><span class="nav-icon" aria-hidden="true">🏛</span><span class="nav-label">Податки</span></button>
      <button data-view="incomes" aria-label="Доходи" title="Доходи"><span class="nav-icon" aria-hidden="true">📈</span><span class="nav-label">Доходи</span></button>
      <button data-view="reports" aria-label="Звітність" title="Звітність"><span class="nav-icon" aria-hidden="true">📋</span><span class="nav-label">Звітність</span></button>
      <button data-view="hr" aria-label="Кадри" title="Кадри"><span class="nav-icon" aria-hidden="true">🪪</span><span class="nav-label">Кадри</span></button>
      <button data-view="calendar" aria-label="Календар" title="Календар"><span class="nav-icon" aria-hidden="true">📅</span><span class="nav-label">Календар</span></button>
      <button data-view="activities" aria-label="Види діяльності" title="Види діяльності"><span class="nav-icon" aria-hidden="true">💼</span><span class="nav-label">Види діяльності</span></button>
      <button data-view="inactive" aria-label="Неактивні" title="Неактивні"><span class="nav-icon" aria-hidden="true">⏸️</span><span class="nav-label">Неактивні</span></button>
      <button data-view="settings" class="nav-bottom-start" aria-label="Налаштування" title="Налаштування"><span class="nav-icon" aria-hidden="true">⚙️</span><span class="nav-label">Налаштування</span></button>
      <button data-view="audit" aria-label="Журнал подій" title="Журнал подій"><span class="nav-icon" aria-hidden="true">📜</span><span class="nav-label">Журнал подій</span></button>
    </nav>
    <div class="side-note">
      <div id="syncStatus" class="sync-status" role="status" aria-live="polite" aria-atomic="true"></div>
      <button class="link" id="authBtn" aria-label="Вийти" title="Вийти"><span class="side-action-icon" aria-hidden="true">⇥</span><span class="side-action-label">Вийти</span></button>
    </div>
  </aside>

  <main>
    <header>
      <div>
        <p id="crumb">Огляд</p>
        <h1 id="title" tabindex="-1">Огляд</h1>
      </div>
      <div class="header-actions">
        <button class="primary quick-note" id="quickNote">+ Задача</button>
      </div>
    </header>
    <div id="content" tabindex="-1" aria-labelledby="title"></div>
  </main>

  <dialog id="modal">
    <form id="modalForm">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button type="button" class="close" id="modalClose" aria-label="Закрити">×</button>
      </div>
      <div id="modalErrors" class="modal-errors" hidden></div>
      <div class="form-grid" id="modalBody"></div>
      <div id="modalDanger" class="modal-danger"></div>
      <footer>
        <button type="button" class="secondary" id="modalCancel">Скасувати</button>
        <button type="submit" class="primary">Зберегти</button>
      </footer>
    </form>
  </dialog>
  </div>

  <!-- Єдина точка входу. Все інше (client-card-ui.js, render/*.js, state.js
       тощо) підвантажується як ES-модулі через import у bootstrap.js. -->
  <script type="module" src="./bootstrap.js"></script>
</body>
</html>
