<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harmony — CRM для бухгалтера ФОП</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="matrix.css">
<link rel="stylesheet" href="client-card-ui.css">
<link rel="icon" href="data:,">
</head>
<body class="auth-locked">
  <div id="bootOverlay" class="boot-overlay" hidden>
    <div class="boot-spinner"></div>
    <p>Завантаження даних…</p>
  </div>

  <section id="authGate" class="auth-gate" aria-labelledby="authTitle">
    <form id="authForm" class="auth-panel">
      <div class="auth-brand" aria-hidden="true">H</div>
      <h1 id="authTitle">Вхід до Harmony</h1>
      <p>Авторизуйтеся, щоб отримати доступ до робочого простору.</p>
      <label>Логін<input id="authLogin" name="login" autocomplete="username" required autofocus></label>
      <label>Пароль<input id="authPassword" name="password" type="password" autocomplete="current-password" required></label>
      <p id="authError" class="auth-error" role="alert" hidden></p>
      <button id="authSubmit" type="submit" class="primary">Увійти</button>
    </form>
  </section>

  <div id="appShell" class="app-shell" hidden inert aria-hidden="true">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">H</div>
      <div class="brand-text">Harmony<small id="userIdentity">CRM для бухгалтера ФОП</small></div>
    </div>
    <nav id="nav">
      <button data-view="overview" class="active">Огляд</button>
      <button data-view="dashboard">Картки клієнтів</button>
      <button data-view="payments">Оплати</button>
      <button data-view="taxes">Податки</button>
      <button data-view="incomes">Доходи</button>
      <button data-view="reports">Звітність</button>
      <button data-view="calendar">Календар</button>
      <button data-view="activities">Види діяльності</button>
      <button data-view="hr">Кадри</button>
      <button data-view="inactive">Неактивні</button>
      <button data-view="deleted" id="deletedNav" hidden>Видалені</button>
      <button data-view="settings">Налаштування</button>
      <button data-view="audit">Журнал подій</button>
    </nav>
    <div class="side-note">
      <div id="syncStatus" class="sync-status"></div>
      <button class="link" id="authBtn">Вийти</button>
      <button class="link" id="exportBtn">Експортувати резервну копію</button>
    </div>
  </aside>

  <main>
    <header>
      <div>
        <p id="crumb">Огляд</p>
        <h1 id="title">Огляд</h1>
      </div>
      <div class="header-actions">
        <button class="primary quick-note" id="quickNote">+ Задача</button>
      </div>
    </header>
    <div id="content"></div>
  </main>

  <dialog id="modal">
    <form id="modalForm">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button type="button" class="close" id="modalClose" aria-label="Закрити">×</button>
      </div>
      <div id="modalErrors" class="modal-errors" hidden></div>
      <div class="form-grid" id="modalBody"></div>
      <div id="modalDanger" class="modal-danger"></div>
      <footer>
        <button type="button" class="secondary" id="modalCancel">Скасувати</button>
        <button type="submit" class="primary">Зберегти</button>
      </footer>
    </form>
  </dialog>
  </div>

  <!-- Єдина точка входу. Все інше (client-card-ui.js, render/*.js, state.js
       тощо) підвантажується як ES-модулі через import у bootstrap.js. -->
  <script type="module" src="./bootstrap.js"></script>
</body>
</html>
