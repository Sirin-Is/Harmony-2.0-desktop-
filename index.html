<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harmony — CRM для бухгалтера ФОП</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="matrix.css">
<link rel="stylesheet" href="client-card-ui.css">
<link rel="icon" href="data:,">
</head>
<body class="auth-locked">
  <a class="skip-link" href="#content">До основного вмісту</a>
  <div id="bootOverlay" class="boot-overlay" hidden>
    <div class="boot-spinner"></div>
    <p>Завантаження даних…</p>
  </div>

  <section id="authGate" class="auth-gate" aria-labelledby="authTitle">
    <form id="authForm" class="auth-panel">
      <div class="auth-brand" aria-hidden="true">H</div>
      <h1 id="authTitle">Вхід до Harmony</h1>
      <p>Авторизуйтеся, щоб отримати доступ до робочого простору.</p>
      <label>Логін<input id="authLogin" name="login" autocomplete="username" required autofocus></label>
      <label>Пароль<input id="authPassword" name="password" type="password" autocomplete="current-password" required></label>
      <p id="authError" class="auth-error" role="alert" hidden></p>
      <button id="authSubmit" type="submit" class="primary">Увійти</button>
    </form>
  </section>

  <div id="appShell" class="app-shell" hidden inert aria-hidden="true">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">H</div>
      <div class="brand-text">Harmony<small id="userIdentity">CRM для бухгалтера ФОП</small></div>
    </div>
    <nav id="nav" aria-label="Основна навігація">
      <button data-view="overview" class="active" aria-label="Огляд" title="Огляд"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20V10h4v10M10 20V4h4v16M16 20v-7h4v7M3 20h18"/></svg></span><span class="nav-label">Огляд</span></button>
      <button data-view="dashboard" aria-label="Картки клієнтів" title="Картки клієнтів"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M17 14a5 5 0 0 1 4 5v1"/></svg></span><span class="nav-label">Картки клієнтів</span></button>
      <button data-view="payments" aria-label="Оплати" title="Оплати"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h3"/></svg></span><span class="nav-label">Оплати</span></button>
      <button data-view="taxes" aria-label="Податки" title="Податки"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 9 9-5 9 5M5 10v7M9 10v7M15 10v7M19 10v7M3 20h18M4 17h16"/></svg></span><span class="nav-label">Податки</span></button>
      <button data-view="incomes" aria-label="Доходи" title="Доходи"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19 10 13l4 4 6-8M15 9h5v5"/></svg></span><span class="nav-label">Доходи</span></button>
      <button data-view="reports" aria-label="Звітність" title="Звітність"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 9h6M9 13h6M9 17h4"/></svg></span><span class="nav-label">Звітність</span></button>
      <button data-view="hr" aria-label="Кадри" title="Кадри"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="8" cy="11" r="2"/><path d="M5 17a3 3 0 0 1 6 0M14 10h4M14 14h4"/></svg></span><span class="nav-label">Кадри</span></button>
      <button data-view="calendar" aria-label="Календар" title="Календар"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h2M14 14h2M8 18h2"/></svg></span><span class="nav-label">Календар</span></button>
      <button data-view="activities" aria-label="Види діяльності" title="Види діяльності"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3M3 12h18M10 12v2h4v-2"/></svg></span><span class="nav-label">Види діяльності</span></button>
      <button data-view="inactive" aria-label="Неактивні" title="Неактивні"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9v6M15 9v6"/></svg></span><span class="nav-label">Неактивні</span></button>
      <button data-view="settings" class="nav-bottom-start" aria-label="Налаштування" title="Налаштування"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.7-.7-1.7.9-1.9-2.1-2.1-1.9.9-1.7-.7-.7-2h-3l-.7 2-1.7.7-1.9-.9-2.1 2.1.9 1.9-.7 1.7-2 .7v3l2 .7.7 1.7-.9 1.9 2.1 2.1 1.9-.9 1.7.7.7 2h3l.7-2 1.7-.7 1.9.9 2.1-2.1-.9-1.9.7-1.7z"/></svg></span><span class="nav-label">Налаштування</span></button>
      <button data-view="audit" aria-label="Журнал подій" title="Журнал подій"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/></svg></span><span class="nav-label">Журнал подій</span></button>
    </nav>
    <div class="side-note">
      <div id="syncStatus" class="sync-status" role="status" aria-live="polite" aria-atomic="true"></div>
      <button class="link" id="authBtn" aria-label="Вийти" title="Вийти"><span class="side-action-icon" aria-hidden="true">⇥</span><span class="side-action-label">Вийти</span></button>
    </div>
  </aside>

  <main>
    <header>
      <div>
        <p id="crumb">Огляд</p>
        <h1 id="title" tabindex="-1">Огляд</h1>
      </div>
      <div class="header-actions">
        <button class="primary quick-note" id="quickNote">+ Задача</button>
      </div>
    </header>
    <div id="content" tabindex="-1" aria-labelledby="title"></div>
  </main>

  <dialog id="modal">
    <form id="modalForm">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button type="button" class="close" id="modalClose" aria-label="Закрити">×</button>
      </div>
      <div id="modalErrors" class="modal-errors" hidden></div>
      <div class="form-grid" id="modalBody"></div>
      <div id="modalDanger" class="modal-danger"></div>
      <footer>
        <button type="button" class="secondary" id="modalCancel">Скасувати</button>
        <button type="submit" class="primary">Зберегти</button>
      </footer>
    </form>
  </dialog>
  </div>

  <!-- Єдина точка входу. Все інше (client-card-ui.js, render/*.js, state.js
       тощо) підвантажується як ES-модулі через import у bootstrap.js. -->
  <script type="module" src="./bootstrap.js"></script>
</body>
</html>
