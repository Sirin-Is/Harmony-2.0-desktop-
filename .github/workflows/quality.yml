name: Verify Harmony

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Type-check and build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Run core business-rule tests
        run: npm test
      - name: Build Vite bundle
        run: npm run build

  desktop:
    name: Check Windows desktop runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust and Tauri configuration
        run: cargo check --manifest-path src-tauri/Cargo.toml
