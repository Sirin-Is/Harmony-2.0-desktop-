name: Verify Harmony

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Type-check and build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Run core business-rule tests
        run: npm test
      - name: Reject vulnerable dependencies
        run: npm audit --audit-level=high
      - name: Build Vite bundle
        run: npm run build

  desktop:
    name: Check Windows desktop runtime
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Rust and Tauri configuration
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
